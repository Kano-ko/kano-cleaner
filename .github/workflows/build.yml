name: Compilar

# Se ejecuta en cada cambio publicado en main y en cada propuesta de cambio (pull request).
# Comprueba la sintaxis y genera el .exe para que se pueda descargar desde la pestaña
# "Actions" sin tener que compilar nada en un equipo propio.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis de JavaScript
        shell: pwsh
        run: |
          $fallos = 0
          Get-ChildItem -Recurse -Filter *.js -Path electron, src | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=$($_.FullName)::Error de sintaxis"
              $fallos++
            }
          }
          if ($fallos -gt 0) { throw "$fallos archivo(s) con errores de sintaxis" }

      - name: Empaquetar el .exe portable
        run: npm run dist

      - name: Guardar el .exe como resultado
        uses: actions/upload-artifact@v4
        with:
          name: KanoCleaner-portable
          path: release/*.exe
          if-no-files-found: error
